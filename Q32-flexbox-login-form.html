<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A centered login form built using CSS Flexbox.">
    <title>Flexbox Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ccfbf1);
            color: #1e293b;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
            color: #173b57;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #64748b;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
        }

        input:focus {
            outline: 3px solid #99f6e4;
            border-color: #0d9488;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .remember input {
            width: auto;
        }

        .submit-button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #0d9488;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #0f766e;
        }

        .note {
            margin-bottom: 0;
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 400px) {
            .login-card {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="login-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your account</p>

            <form action="#" method="get">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        placeholder="student@example.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required>
                </div>

                <label class="remember">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>

                <button class="submit-button" type="submit">Sign In</button>
            </form>

            <p class="note">
                Academic demonstration only. This form does not authenticate
                users or store passwords.
            </p>
        </section>
    </main>
</body>
</html>
