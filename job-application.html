
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <h1>Job Application Form</h1>

    <form action="#" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label for="password">Account Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="65">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <label for="interview">Preferred Interview Date:</label>
        <input type="datetime-local" id="interview" name="interview">
        <br><br>

        <label for="month">Available From Month:</label>
        <input type="month" id="month" name="month">
        <br><br>

        <label for="week">Preferred Joining Week:</label>
        <input type="week" id="week" name="week">
        <br><br>

        <label for="time">Preferred Interview Time:</label>
        <input type="time" id="time" name="time">
        <br><br>

        <label for="website">Portfolio URL:</label>
        <input type="url" id="website" name="website">
        <br><br>

        <label for="search">Search Job Role:</label>
        <input type="search" id="search" name="search">
        <br><br>

        <label for="color">Preferred Theme Color:</label>
        <input type="color" id="color" name="color" value="#2563eb">
        <br><br>

        <label for="experience">Experience Level (0–10):</label>
        <input type="range" id="experience" name="experience"
               min="0" max="10" value="0">
        <br><br>

        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
        <br><br>

        <p>Employment Type:</p>
        <input type="radio" id="fulltime" name="employment" value="fulltime">
        <label for="fulltime">Full-time</label>
        <input type="radio" id="intern" name="employment" value="intern">
        <label for="intern">Internship</label>
        <br><br>

        <label for="skills">Skills:</label>
        <select id="skills" name="skills" multiple>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="git">Git</option>
        </select>
        <br><br>

        <label for="cover">Cover Letter:</label>
        <textarea id="cover" name="cover" rows="5"></textarea>
        <br><br>

        <input type="hidden" name="form_version" value="1">

        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent">I confirm that my details are accurate.</label>
        <br><br>

        <button type="submit">Submit Application</button>
        <button type="reset">Clear Form</button>
    </form>
</body>
</html>
