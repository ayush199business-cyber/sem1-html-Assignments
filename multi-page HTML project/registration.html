
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Demonstration student registration form.">
    <title>Registration | Ayush Sharma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Registration</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="registration.html">Registration</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <form action="#" method="post">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="course">Course</label>
            <select id="course" name="course" required>
                <option value="">Choose a course</option>
                <option value="BCAI">BCAI</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
            </select>

            <button type="submit">Register</button>
        </form>
        <p>This is a demonstration form and does not store registrations.</p>
    </main>
    <footer><p>&copy; 2026 Ayush Sharma</p></footer>
</body>
</html>
