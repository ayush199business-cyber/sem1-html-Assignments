
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Demonstration</title>
    <style>
        /* 1. Element selector */
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            margin: 25px;
        }

        /* 2. Class selector */
        .highlight {
            background: #dbeafe;
            padding: 12px;
            border-radius: 6px;
        }

        /* 3. ID selector */
        #main-title {
            color: #1d4ed8;
            text-align: center;
        }

        /* 4. Descendant selector */
        main p {
            line-height: 1.8;
            color: #334155;
        }

        /* 5. Attribute selector */
        input[type="email"] {
            border: 2px solid #2563eb;
            padding: 8px;
        }

        /* 6. Pseudo-class selector */
        a:hover {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <h1 id="main-title">CSS Selectors</h1>

    <main>
        <p class="highlight">This paragraph uses a class selector.</p>
        <p>This paragraph uses the descendant selector.</p>

        <h2>Contact</h2>
        <input type="email" placeholder="Enter your email">
        <p><a href="https://github.com/ayush199business-cy">Visit GitHub</a></p>
    </main>
</body>
</html>
