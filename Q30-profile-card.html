
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Profile card for Ayush Sharma, BCAI student.">
    <title>Profile Card - Ayush Sharma</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #243047;
        }

        .profile-card {
            width: min(100%, 380px);
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgb(15 23 42 / 10%);
        }

        .avatar {
            width: 100px;
            height: 100px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 2rem;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.6rem;
        }

        .role {
            margin-top: 0;
            color: #0f766e;
            font-weight: bold;
        }

        .description {
            line-height: 1.6;
        }

        .links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .links a {
            padding: 10px 14px;
            border-radius: 6px;
            background: #1d4ed8;
            color: white;
            text-decoration: none;
        }

        .links a:hover,
        .links a:focus-visible {
            background: #1e40af;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="profile-card">
        <div class="avatar" aria-hidden="true">AS</div>

        <h1>Ayush Sharma</h1>
        <p class="role">BCAI Student</p>

        <p class="description">
            First-year, first-semester student at Invertis University.
            Learning HTML, CSS, programming, and web development.
        </p>

        <p>Course duration: Three Years</p>

        <div class="links">
            <a href="https://github.com/ayush199business-cy">GitHub</a>
            <a href="https://leetcode.com/u/Ayush55199/">LeetCode</a>
            <a href="https://www.geeksforgeeks.org/profile/ayush199b0udv">GeeksforGeeks</a>
            <a href="https://www.linkedin.com/in/ayush-sharma-969904392">LinkedIn</a>
        </div>
    </main>
</body>
</html>
