
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive photo gallery created using CSS Grid.">
    <title>Photo Gallery | CSS Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #173b57;
            --accent: #0d9488;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--background);
        }

        .site-header {
            padding: 30px 20px;
            text-align: center;
            color: white;
            background: var(--primary);
        }

        .site-header h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 4vw, 2.7rem);
        }

        .site-header p {
            margin: 0;
            color: #dbeafe;
        }

        .container {
            width: min(100% - 32px, 1150px);
            margin: 35px auto;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .gallery-item {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.08);
        }

        .gallery-item.featured {
            grid-column: span 2;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item.featured img {
            height: 300px;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .gallery-item figcaption {
            padding: 14px 16px;
            font-weight: bold;
        }

        .gallery-item figcaption span {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: normal;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 750px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .gallery-item.featured {
                grid-column: span 2;
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-item.featured {
                grid-column: span 1;
            }

            .gallery-item img,
            .gallery-item.featured img {
                height: 220px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .gallery-item img {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <h1>My Photo Gallery</h1>
        <p>A responsive image gallery built with CSS Grid.</p>
    </header>

    <main class="container">
        <section class="gallery" aria-label="Photo gallery">
            <figure class="gallery-item featured">
                <img
                    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=1200&amp;q=80"
                    alt="Mountain landscape with an expansive natural view"
                    fetchpriority="high">
                <figcaption>
                    Nature and Landscapes
                    <span>Featured photograph</span>
                </figcaption>
            </figure>

            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=700&amp;q=80"
                    alt="Lake surrounded by mountains"
                    loading="lazy">
                <figcaption>Mountain Lake</figcaption>
            </figure>

            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=700&amp;q=80"
                    alt="Sunlight filtering through a green forest"
                    loading="lazy">
                <figcaption>Forest Walk</figcaption>
            </figure>

            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&amp;fit=crop&amp;w=700&amp;q=80"
                    alt="Wildlife in a natural landscape"
                    loading="lazy">
                <figcaption>Wildlife</figcaption>
            </figure>

            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=700&amp;q=80"
                    alt="Mountain range reflected in a lake"
                    loading="lazy">
                <figcaption>Mountain Reflections</figcaption>
            </figure>

            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=700&amp;q=80"
                    alt="Warm sunrise over a green landscape"
                    loading="lazy">
                <figcaption>Golden Sunrise</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Grid Photo Gallery</p>
    </footer>
</body>
</html>
