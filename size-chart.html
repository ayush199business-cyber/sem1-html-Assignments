
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Shirt Size Chart</title>
</head>
<body>
    <h1>T-Shirt Size Chart</h1>

    <table>
        <caption>Sample T-Shirt Measurements in Centimeters</caption>
        <thead>
            <tr>
                <th scope="col">Size</th>
                <th scope="col">Chest</th>
                <th scope="col">Shoulder</th>
                <th scope="col">Length</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">S</th>
                <td>91</td>
                <td>42</td>
                <td>66</td>
            </tr>
            <tr>
                <th scope="row">M</th>
                <td>97</td>
                <td>44</td>
                <td>69</td>
            </tr>
            <tr>
                <th scope="row">L</th>
                <td>102</td>
                <td>46</td>
                <td>72</td>
            </tr>
            <tr>
                <th scope="row">XL</th>
                <td>107</td>
                <td>48</td>
                <td>75</td>
            </tr>
        </tbody>
    </table>

    <p>Measurements are illustrative. Check the seller's actual size chart before ordering.</p>
</body>
</html>
