
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Design Tokens</title>
    <style>
        :root {
            --color-primary: #1d4ed8;
            --color-secondary: #0f766e;
            --color-background: #f1f5f9;
            --color-surface: #ffffff;
            --color-text: #263449;

            --font-small: 0.875rem;
            --font-normal: 1rem;
            --font-large: 1.5rem;
            --font-heading: 2rem;

            --space-small: 8px;
            --space-medium: 16px;
            --space-large: 28px;

            --radius: 10px;
        }

        body {
            margin: 0;
            padding: var(--space-large);
            font-family: Arial, sans-serif;
            font-size: var(--font-normal);
            color: var(--color-text);
            background: var(--color-background);
        }

        .card {
            max-width: 600px;
            margin: auto;
            padding: var(--space-large);
            background: var(--color-surface);
            border-radius: var(--radius);
        }

        h1 {
            font-size: var(--font-heading);
            color: var(--color-primary);
        }

        h2 {
            font-size: var(--font-large);
            color: var(--color-secondary);
        }

        p {
            font-size: var(--font-normal);
        }

        .note {
            font-size: var(--font-small);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>My Design System</h1>
        <h2>Reusable CSS Variables</h2>
        <p>Design tokens make colors, font sizes, spacing, and
           border radii consistent throughout a website.</p>
        <p class="note">Created by Ayush Sharma</p>
    </main>
</body>
</html>
